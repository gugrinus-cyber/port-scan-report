name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile Python
        run: python -m py_compile port_scan_report.py
      - name: Run sample analysis
        run: python port_scan_report.py tests/sample.log --output /tmp/port_scan_report.md
      - name: Check report and privacy boundary
        run: |
          grep -q "Source token" /tmp/port_scan_report.md
          grep -q "Privacy and safety" /tmp/port_scan_report.md
